name: Build Pashmak Store v6.2.0 FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Pashmak v6.2.0 ZIP
        run: |
          echo "Searching for Pashmak v6.2.0 ZIP..."
          find . -type f -iname "Pashmak_Store_v6_2_0_FINAL*.zip" -print

          ZIP=$(find . -type f -iname "Pashmak_Store_v6_2_0_FINAL*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Pashmak v6.2.0 ZIP not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Verify ZIP integrity
        run: |
          unzip -t "$ZIP"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          echo "Searching for settings.gradle..."
          find extracted -name settings.gradle -o -name settings.gradle.kts

          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify Pashmak project
        run: |
          test -f "$PROJECT/app/build.gradle" || test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/assets/index.html"

          grep -R "com.pashmak.store.v620final" "$PROJECT/app" || true
          grep -R "6.2.0" "$PROJECT/app" || true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v6.2.0-FINAL
          path: ${{ env.PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
