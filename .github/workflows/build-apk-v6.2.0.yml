name: Build Pashmak Store v6.2.0 AUDITED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find audited V6.2.0 ZIP
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r ZIP; do
            echo "Checking: $ZIP"

            if unzip -l "$ZIP" | grep -q "pashmak_final_work/settings.gradle" \
              && unzip -l "$ZIP" | grep -q "pashmak_final_work/app/build.gradle" \
              && unzip -l "$ZIP" | grep -q "com/pashmak/store/v620final/MainActivity.java" \
              && unzip -l "$ZIP" | grep -q "pashmak_final_work/app/src/main/assets/index.html"; then

              FOUND="$ZIP"
              break
            fi

          done < <(
            find . -type f -iname "*.zip" ! -path "./.git/*" | sort
          )

          if [ -z "$FOUND" ]; then
            echo "ERROR: Audited V6.2.0 source ZIP was not found."
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "FOUND ZIP: $FOUND"
          echo "ZIP_FILE=$FOUND" >> "$GITHUB_ENV"

      - name: Verify source ZIP
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"

      - name: Extract audited project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted \
            -type f \
            -name "settings.gradle" \
            | sort \
            | head -n1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify audited project identity
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN_JAVA="$PROJECT_DIR/app/src/main/java/com/pashmak/store/v620final/MainActivity.java"

          test -f "$APP_GRADLE"
          test -f "$INDEX"
          test -f "$MAIN_JAVA"

          grep -Fq "namespace 'com.pashmak.store.v620final'" "$APP_GRADLE"
          grep -Fq "applicationId 'com.pashmak.store.v620final'" "$APP_GRADLE"
          grep -Fq "compileSdk 35" "$APP_GRADLE"
          grep -Fq "minSdk 23" "$APP_GRADLE"
          grep -Fq "targetSdk 35" "$APP_GRADLE"
          grep -Fq "versionCode 620" "$APP_GRADLE"
          grep -Fq "versionName '6.2.0-final'" "$APP_GRADLE"

          echo "Project identity verified."

      - name: Verify manual inventory and JSON code
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "parseInventoryText" "$INDEX"
          grep -Fq "parseInventoryJSON" "$INDEX"
          grep -Fq "applyInitialInventoryUI" "$INDEX"
          grep -Fq "applyInitialInventoryRows" "$INDEX"
          grep -Fq "inventory_update" "$INDEX"

          echo "Manual inventory and JSON functions found."

      - name: Verify Android file chooser support
        shell: bash
        run: |
          set -euo pipefail

          MAIN_JAVA="$PROJECT_DIR/app/src/main/java/com/pashmak/store/v620final/MainActivity.java"

          grep -Fq "WebChromeClient" "$MAIN_JAVA"
          grep -Fq "onShowFileChooser" "$MAIN_JAVA"
          grep -Fq "ValueCallback<Uri[]>" "$MAIN_JAVA"

          echo "Android WebView file chooser support verified."

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node - "$PROJECT_DIR/app/src/main/assets/index.html" <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const file = process.argv[2];
          const html = fs.readFileSync(file, 'utf8');

          const scripts = [
            ...html.matchAll(
              /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi
            )
          ];

          if (scripts.length === 0) {
            throw new Error('No JavaScript blocks found.');
          }

          scripts.forEach((match, index) => {
            new vm.Script(
              match[1],
              { filename: `index-script-${index}.js` }
            );
          });

          console.log(
            `JavaScript syntax OK: ${scripts.length} blocks checked.`
          );
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Generated APK:"
          echo "$APK"

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          BADGING=$(aapt dump badging "$APK")

          echo "$BADGING"

          echo "$BADGING" | grep -Fq \
            "package: name='com.pashmak.store.v620final'"

          echo "$BADGING" | grep -Fq \
            "versionCode='620'"

          echo "$BADGING" | grep -Fq \
            "versionName='6.2.0-final'"

          echo "APK identity verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v6.2.0-AUDITED
          path: ${{ env.APK }}
          if-no-files-found: error
