name: Build Pashmak Store 6.2.0 FINAL AUTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find V6.2.0 project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching all ZIP files..."

          FOUND=""

          while IFS= read -r ZIP; do
            echo "Checking: $ZIP"

            if unzip -l "$ZIP" | grep -q "com/pashmak/store/v620final/MainActivity.java"; then
              FOUND="$ZIP"
              break
            fi
          done < <(find . -type f -iname "*.zip")

          if [ -z "$FOUND" ]; then
            echo "ERROR: V6.2.0 project ZIP was not found."
            echo "ZIP files found:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "FOUND ZIP: $FOUND"
          echo "ZIP=$FOUND" >> "$GITHUB_ENV"

      - name: Verify ZIP
        run: |
          unzip -t "$ZIP"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify V6.2.0
        run: |
          set -e

          grep -R "com.pashmak.store.v620final" "$PROJECT/app"
          grep -R "versionCode 620" "$PROJECT/app"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "V6.2.0 project verified successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v6.2.0-FINAL
          path: ${{ env.PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v6.2.0-FINAL
          path: ${{ env.PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
